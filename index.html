<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handpan 1.6</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg1: #0e0f12; --bg2: #1d1f26; --text: #eef0f4; --muted: #9aa0ad;
    --accent: #f0b46a; --panel: rgba(255, 255, 255, .05); --line: rgba(255, 255, 255, .13);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg1) 70%);
    color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none; touch-action: none;
  }
  header { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 16px 16px 0; }
  header { position: relative; }
  #lang {
    position: absolute; right: 16px; top: 14px; z-index: 4;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #lang option, #lang optgroup { background: var(--bg2); color: var(--text); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  header h1 { margin: 0; font-weight: 300; letter-spacing: .3em; font-size: 13px; text-transform: uppercase; color: var(--muted); position: absolute; left: 20px; top: 18px; }
  #scale { text-align: center; min-width: 240px; }
  #scaleName { font-size: 24px; font-weight: 300; }
  #scaleNotes { color: var(--accent); font-size: 13px; letter-spacing: .06em; margin-top: 2px; }
  .nav {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 24px; cursor: pointer; display: grid; place-items: center;
  }
  .nav:hover { background: rgba(255, 255, 255, .12); }
  #stage { flex: 1; min-height: 220px; display: grid; place-items: center; padding: 8px; }
  #pan { width: min(100%, 100%); height: 100%; max-height: 100%; }
  .field, .ding { cursor: pointer; }
  .lbl { pointer-events: none; text-anchor: middle; dominant-baseline: middle; fill: rgba(255, 240, 225, .85); font-family: "Segoe UI", sans-serif; }
  .key { pointer-events: none; text-anchor: middle; dominant-baseline: middle; fill: var(--accent); font-weight: 600; font-family: "Segoe UI", sans-serif; }
  .glow { pointer-events: none; opacity: 0; }

  #kbd { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 16px 4px; }
  .row { display: flex; gap: 6px; }
  .row:nth-child(2) { margin-left: 22px; } .row:nth-child(3) { margin-left: 52px; }
  .cap {
    width: 54px; height: 46px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative;
  }
  .cap b { font-size: 14px; font-weight: 600; }
  .cap span { font-size: 10px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
  .cap.soft b { color: #a9b6d8; } .cap.tone b { color: var(--accent); } .cap.perc b { color: #8fd3b0; } .cap.nav2 b { color: #c9a9e6; }
  .cap.blank { opacity: .25; cursor: default; }
  .cap.space { width: 320px; margin-left: 0; }
  .cap.lit { background: rgba(240, 180, 106, .35); }
  #controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; padding: 10px 16px 4px; }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  footer { display: flex; justify-content: space-between; gap: 12px; padding: 6px 16px 10px; font-size: 12px; color: var(--muted); opacity: .75; }
  /* Inklapbaar paneel: toetsenbord, schuifjes en voettekst */
  #dock { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s ease; }
  #dock > div { overflow: hidden; min-height: 0; }
  body.folded #dock { grid-template-rows: 0fr; }
  /* Liedjes leren: balk onder de kop, rood doelveld op de handpan */
  #songBar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 8px 16px 0; }
  #songBar select, #songBar button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  #songBar select option { background: var(--bg2); }
  #songBar button:hover:not(:disabled) { background: rgba(255, 255, 255, .12); }
  #songBar button:disabled { opacity: .35; cursor: default; }
  #songBar button.on { background: rgba(255, 77, 77, .25); border-color: #ff4d4d; }
  #songStatus { min-width: 150px; font-size: 13px; color: var(--muted); text-align: center; }
  #songStatus.good { color: #8fd3b0; } #songStatus.bad { color: #ff7a7a; }
  .target { opacity: 0; pointer-events: none; fill: #ff3b3b; fill-opacity: .5; stroke: #ff4d4d; stroke-width: 2.4; transition: opacity .15s; }
  .target.now { opacity: 1; animation: targetPulse 1s ease-in-out infinite; }
  .target.next { opacity: .7; fill-opacity: 0; stroke-dasharray: 3 2.5; stroke-width: 1.6; }
  @keyframes targetPulse { 50% { fill-opacity: .22; } }
  .cap.target-now { border-color: #ff4d4d; box-shadow: 0 0 0 2px rgba(255, 77, 77, .55); }
  /* Recorder linksonder en donatieknop rechtsonder, altijd zichtbaar (ook ingeklapt) */
  body { padding-bottom: 66px; }
  .corner { position: fixed; bottom: 12px; z-index: 5; display: flex; align-items: center; gap: 6px;
    background: rgba(20, 21, 26, .85); border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px; backdrop-filter: blur(4px); }
  #recBar { left: 12px; }
  #recBar button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 17px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  #recBar button:hover:not(:disabled) { background: rgba(255, 255, 255, .12); }
  #recBar button:disabled { opacity: .3; cursor: default; }
  #recBtn { color: #ff5a5a !important; }
  #recBar.recording #recBtn { background: rgba(255, 70, 70, .25); animation: recPulse 1.2s infinite; }
  #recBar.paused #recBtn { animation: none; }
  @keyframes recPulse { 50% { box-shadow: 0 0 0 6px rgba(255, 70, 70, .15); } }
  #recTime { min-width: 52px; padding: 0 4px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  #recBar.recording #recTime { color: #ff7a7a; }
  #coffeeBtn { right: 12px; padding: 0 18px; height: 54px; color: var(--accent); text-decoration: none; font-size: 15px; }
  #coffeeBtn:hover { background: rgba(240, 180, 106, .18); }
  #fold {
    align-self: center; width: 64px; height: 26px; margin: 2px 0; border-radius: 13px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    transition: transform .35s ease, background .2s;
  }
  #fold:hover { background: rgba(255, 255, 255, .12); color: var(--text); }
  body.folded #fold { transform: rotate(180deg); margin-bottom: 10px; }
  @media (max-width: 760px) {
    #kbd { display: none; }
    header h1 { display: none; }
    #coffeeBtn span { display: none; }
    #coffeeBtn { padding: 0 16px; font-size: 20px; }
    header { padding-top: 52px; }
  }
  @media (max-height: 700px) { .cap { height: 38px; } .cap span { display: none; } }

  #studio { max-width: 850px; margin: 6px auto; padding: 0 14px; max-height: 29vh; overflow: auto; touch-action: pan-y; }
  #studio summary { cursor: pointer; color: var(--accent); padding: 8px; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 9px 0; }
  .tools button, .tools select, .tools input { font: inherit; color: var(--text); background: #272830; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
  .tools button { cursor: pointer; } .tools button:disabled { opacity: .4; cursor: default; }
  .tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .tools input[type=number] { width: 75px; } .tools label { flex-wrap: wrap; }
  #studio p { color: var(--muted); font-size: 12px; margin: 8px 0; }
  #studioStatus { min-height: 20px; color: var(--accent) !important; }
  #touchPerc { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:5px; }
  #touchPerc button { background:var(--panel); color:#8fd3b0; border:1px solid var(--line); padding:8px 16px; border-radius:8px; cursor:pointer; }
  #touchPerc .damp { color:var(--accent); }
  #touchPerc button:not(.damp) { display:none; }
  #studioStatus { position:sticky; top:0; background:#1d1f26; padding:7px; z-index:1; border-radius:6px; }
  button:focus-visible, select:focus-visible, input:focus-visible, .field:focus-visible, .ding:focus-visible, .cap:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .field:focus-visible, .ding:focus-visible { filter:brightness(1.5); }
  @media(max-width:760px) { #touchPerc button:not(.damp) { display:block; } #scale { min-width:0; } #scaleNotes { max-width:65vw; font-size:11px; } #scaleName { font-size:20px; } #studio { max-height:35vh; } }
</style>
</head>

</div></div>

<div id="recBar" class="corner">

// ---------- Toetsindeling (fysieke toetsen, werkt ook bij AZERTY/QWERTZ op dezelfde plek) ----------
const TONE_KEYS = ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL'];
const SOFT_KEYS = ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO'];
const PERC = { KeyZ: 'gu', KeyX: 'tak', KeyC: 'slap' };

const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function freq(n) {
  const m = n.match(/^([A-G])(#|b)?(\d)$/);
  const midi = 12 * (+m[3] + 1) + NOTE_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('handpan.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('handpan.' + k, JSON.stringify(v)); } catch {} },
};

// ---------- Audio ----------
let ctx, bus, master, wet, noiseBuf, capture;
const voices = [];

function initAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new AudioContext({ latencyHint: 'interactive' });
  master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.ratio.value = 4;
  master.connect(comp).connect(ctx.destination);
  capture = ctx.createMediaStreamDestination(); comp.connect(capture);
  bus = ctx.createGain();
  const dry = ctx.createGain(); dry.gain.value = .85;
  bus.connect(dry).connect(master);
  const conv = ctx.createConvolver(); conv.buffer = impulse(3.2);
  wet = ctx.createGain();
  bus.connect(conv).connect(wet).connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  applyMix();
}

function impulse(sec) {
  const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  return buf;
}

function applyMix() {
  if (!ctx) return;
  master.gain.setTargetAtTime(+vol.value, ctx.currentTime, .05);
  wet.gain.setTargetAtTime(+verb.value * 1.1, ctx.currentTime, .05);
}

function noiseBurst(out, t, type, f, q, amp, dur) {
  const n = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
  n.buffer = noiseBuf; flt.type = type; flt.frequency.value = f; flt.Q.value = q;
  g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  n.connect(flt).connect(g).connect(out); n.start(t); n.stop(t + dur + .01);
}

// Een handpantoon: grondtoon, octaaf en kwint daarboven (zo stemt een handpanbouwer elk veld)
function tone(f, vel, when) {
  initAudio();
  const t = when ?? ctx.currentTime, out = ctx.createGain(), nodes = [];
  out.connect(bus);
  const dec = Math.max(2.2, Math.min(7, 6 * Math.sqrt(220 / f)));
  const bright = (.35 + vel * .9) * (.96 + Math.random() * .08);
  vel *= .98 + Math.random() * .04;
  [[1, 1, 1, 0], [2, .45 * bright, .55, 1.5], [3, .18 * bright, .3, -2]].forEach(([r, a, df, cents]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = f * r * Math.pow(2, cents / 1200);
    if (r === 1) { o.frequency.setValueAtTime(f * 1.004, t); o.frequency.exponentialRampToValueAtTime(f, t + .08); }
    const peak = a * vel * .3;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + (vel < .5 ? .018 : .006));
    g.gain.setTargetAtTime(0, t + .02, (dec * df) / 4.5);
    o.connect(g).connect(out); o.start(t); o.stop(t + dec * 1.3); nodes.push(o);
  });
  // Doffe aanslag van de vinger
  noiseBurst(out, t, 'lowpass', Math.min(4000, f * 3), .7, .12 * vel, .04);
  const voice = { out, nodes };
  voices.push(voice);
  nodes[0].onended = () => {
    out.disconnect();
    const i = voices.indexOf(voice); if (i >= 0) voices.splice(i, 1);
    nodes.forEach(n => n.disconnect());
  };
  while (voices.length > 28) {
    const v = voices.shift();
    v.out.gain.setTargetAtTime(0, ctx.currentTime, .08);
  }
}

function perc(kind, when) {
  initAudio();
  const t = when ?? ctx.currentTime, out = ctx.createGain();
  out.connect(bus);
  setTimeout(() => out.disconnect(), Math.max(0, (t - ctx.currentTime + 1.5) * 1000));
  if (kind === 'gu') {
    // Lucht in de onderste opening: lage, vallende toon
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(68, t + .25);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55, t + .01); g.gain.setTargetAtTime(0, t + .02, .16);
    o.connect(g).connect(out); o.start(t); o.stop(t + 1.2);
    noiseBurst(out, t, 'lowpass', 300, .8, .25, .12);
  } else if (kind === 'tak') {
    noiseBurst(out, t, 'bandpass', 3200, 2.5, .35, .045);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 1730;
    g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + .09);
    o.connect(g).connect(out); o.start(t); o.stop(t + .1);
  } else {
    // Slap op de ding: kort, vol en percussief
    const s = SCALES[current()], f = freq(s.ding);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32, t + .004); g.gain.setTargetAtTime(0, t + .01, .09);
    o.connect(g).connect(out); o.start(t); o.stop(t + .8);
    noiseBurst(out, t, 'bandpass', 900, .9, .4, .08);
  }
}

// ---------- Handpan tekenen ----------
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('pan');
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
};
const keyName = (code) => code.replace('Key', '');
let fieldEls = [], dingEl = null;

function buildPan() {
  svg.innerHTML = '';
  const defs = el('defs', {});
  defs.innerHTML = `
    <radialGradient id="shell" cx="42%" cy="35%" r="75%">
      <stop offset="0" stop-color="#6d5241"/><stop offset=".45" stop-color="#3b2c24"/><stop offset="1" stop-color="#141010"/>
    </radialGradient>
    <radialGradient id="fieldG" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7c5d48"/><stop offset="1" stop-color="#2c211b"/>
    </radialGradient>
    <radialGradient id="dimple" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#9b7a60"/><stop offset="1" stop-color="#4a372c"/>
    </radialGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#ffd59a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb860" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>`;
  el('ellipse', { cx: 0, cy: 6, rx: 100, ry: 96, fill: 'rgba(0,0,0,.5)' });
  el('circle', { r: 98, fill: 'url(#shell)', stroke: '#1a1411', 'stroke-width': 1.5 });
  el('circle', { r: 94.5, fill: 'none', stroke: 'rgba(255,220,180,.12)', 'stroke-width': 1 });
  el('circle', { r: 98, fill: 'url(#sheen)' });

  const s = SCALES[current()];
  fieldEls = s.notes.map((n, k) => {
    // Zigzag rond de ding, net als op een echte handpan: laagste onderaan, afwisselend rechts en links omhoog
    const ang = (k === 0 ? 0 : (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 40) * Math.PI / 180;
    const rad = 63, x = Math.sin(ang) * rad, y = Math.cos(ang) * rad;
    const size = 20.5 - k * .9;
    const rot = -ang * 180 / Math.PI;
    const gEl = el('g', { class: 'field', transform: `translate(${x.toFixed(2)} ${y.toFixed(2)})` });
    el('ellipse', { rx: size * .8, ry: size, transform: `rotate(${rot})`, fill: 'url(#fieldG)', stroke: 'rgba(0,0,0,.45)', 'stroke-width': 1 }, gEl);
    el('ellipse', { rx: size * .38, ry: size * .45, transform: `rotate(${rot})`, fill: 'url(#dimple)' }, gEl);
    const glow = el('ellipse', { class: 'glow', rx: size * 1.05, ry: size * 1.25, transform: `rotate(${rot})`, fill: 'url(#glowG)' }, gEl);
    el('text', { class: 'lbl', y: -3, 'font-size': 6.5 }, gEl).textContent = n.replace('b', '♭').replace('#', '♯');
    el('text', { class: 'key', y: 6, 'font-size': 6 }, gEl).textContent = keyName(TONE_KEYS[k]);
    gEl.addEventListener('pointerdown', (ev) => { ev.preventDefault(); playTone(k, ev.pressure > 0 && ev.pressure !== .5 ? .5 + ev.pressure * .5 : .85); });
    return { g: gEl, glow };
  });

  const dg = el('g', { class: 'ding' });
  el('circle', { r: 25, fill: 'url(#fieldG)', stroke: 'rgba(0,0,0,.5)', 'stroke-width': 1 }, dg);
  el('circle', { r: 13, fill: 'url(#dimple)' }, dg);
  el('ellipse', { cx: -4, cy: -5, rx: 6, ry: 4, fill: 'rgba(255,240,220,.25)' }, dg);
  const glow = el('circle', { class: 'glow', r: 30, fill: 'url(#glowG)' }, dg);
  el('text', { class: 'lbl', y: -3, 'font-size': 7.5 }, dg).textContent = s.ding.replace('b', '♭').replace('#', '♯');
  el('text', { class: 'key', y: 7, 'font-size': 5.5 }, dg).textContent = LANGS[lang].space;
  dg.addEventListener('pointerdown', (ev) => { ev.preventDefault(); playDing(.9); });
  dingEl = { g: dg, glow };
}

function flash(target, strength) {
  target.glow.animate([{ opacity: strength }, { opacity: 0 }], { duration: 1400, easing: 'cubic-bezier(.2,.7,.3,1)' });
}
function lightCap(code) {
  const c = capEls[code];
  if (!c) return;
  c.animate([{ background: 'rgba(240,180,106,.55)' }, { background: 'rgba(255,255,255,.05)' }], { duration: 500 });
}

// ---------- Spelen ----------
function playTone(k, vel) {
  const s = SCALES[current()];
  tone(freq(s.notes[k]), vel);
  flash(fieldEls[k], .35 + vel * .6);
  lightCap(vel < .6 ? SOFT_KEYS[k] : TONE_KEYS[k]);
}
function playDing(vel) {
  tone(freq(SCALES[current()].ding), vel);
  flash(dingEl, .35 + vel * .6);
  lightCap('Space');
}
function playPerc(kind, code) {
  perc(kind);
  if (kind === 'slap') flash(dingEl, .5);
  if (code) lightCap(code);
}

// ---------- Toonladder wisselen ----------
let idx = store.get('scale', 0);
const current = () => ((idx % SCALES.length) + SCALES.length) % SCALES.length;
function setScale(step) {
  if (step && typeof studioScaleChanged === 'function') studioScaleChanged();
  idx += step;
  const i = current(), s = SCALES[i], t = LANGS[lang];
  scaleName.textContent = t.scales[i];
  scaleNotes.textContent = `${s.ding} | ${s.notes.join(' ')} · ${t.moods[i]}`;
  store.set('scale', current());
  buildPan();
  buildKbd();
}

// ---------- Toetsenbordkaart ----------
const kbd = document.getElementById('kbd');
let capEls = {};
function buildKbd() {
  const s = SCALES[current()], t = LANGS[lang];
  kbd.innerHTML = '';
  capEls = {};
  const row = () => { const r = document.createElement('div'); r.className = 'row'; kbd.appendChild(r); return r; };
  const cap = (r, code, label, sub, cls, action) => {
    const c = document.createElement('div');
    c.className = 'cap ' + cls;
    c.innerHTML = `<b>${label}</b><span>${sub}</span>`;
    if (action) c.addEventListener('pointerdown', (ev) => { ev.preventDefault(); action(); });
    r.appendChild(c);
    if (code) capEls[code] = c;
  };
  const pretty = (n) => n.replace('b', '♭').replace('#', '♯');
  const r1 = row(), r2 = row(), r3 = row(), r4 = row();
  SOFT_KEYS.forEach((code, k) => cap(r1, code, keyName(code), pretty(s.notes[k]) + ' ' + t.soft, 'soft', () => playTone(k, .4)));
  cap(r1, null, 'P', '', 'blank');
  TONE_KEYS.forEach((code, k) => cap(r2, code, keyName(code), pretty(s.notes[k]), 'tone', () => playTone(k, .85)));
  cap(r2, null, ';', '', 'blank');
  Object.entries(PERC).forEach(([code, kind]) => cap(r3, code, keyName(code), t.perc[kind], 'perc', () => playPerc(kind, code)));
  ['V', 'B', 'N', 'M'].forEach(k => cap(r3, null, k, '', 'blank'));
  cap(r3, 'Comma', '&lt;', t.prevShort, 'nav2', () => setScale(-1));
  cap(r3, 'Period', '&gt;', t.nextShort, 'nav2', () => setScale(1));
  cap(r4, 'Space', t.space, 'Ding ' + pretty(s.ding), 'tone space', () => playDing(.9));
}

const scaleName = document.getElementById('scaleName'), scaleNotes = document.getElementById('scaleNotes');
const vol = document.getElementById('vol'), verb = document.getElementById('verb');
vol.value = store.get('vol', .8); verb.value = store.get('verb', .35);
vol.oninput = () => { applyMix(); store.set('vol', +vol.value); };
verb.oninput = () => { applyMix(); store.set('verb', +verb.value); };
document.getElementById('prev').onclick = () => setScale(-1);
document.getElementById('next').onclick = () => setScale(1);

// Toetsenbord inklappen zodat de handpan het hele venster vult (handig met touchscreen)
function setFolded(f) {
  document.body.classList.toggle('folded', f);
  store.set('folded', f);
}
document.getElementById('fold').onclick = () => setFolded(!document.body.classList.contains('folded'));
setFolded(store.get('folded', false));

document.addEventListener('keydown', (ev) => {
  if (ev.repeat || ev.ctrlKey || ev.altKey || ev.metaKey) return;
  if (ev.target.closest('#studio') || ev.target.tagName === 'SELECT') return;
  if (ev.target.tagName === 'INPUT' && ev.code.startsWith('Arrow')) return;
  if (ev.code === 'Space' && ev.target.tagName === 'BUTTON') ev.target.blur();
  const c = ev.code;
  let k;
  if ((k = TONE_KEYS.indexOf(c)) >= 0) playTone(k, ev.shiftKey ? .4 : .85);
  else if ((k = SOFT_KEYS.indexOf(c)) >= 0) playTone(k, .4);
  else if (c === 'Backspace') dampTones();
  else if (c === 'Space') playDing(ev.shiftKey ? .4 : .9);
  else if (PERC[c]) playPerc(PERC[c], c);
  else if (c === 'Comma' || c === 'ArrowLeft' || ev.key === '<') { setScale(-1); lightCap('Comma'); }
  else if (c === 'Period' || c === 'ArrowRight' || ev.key === '>') { setScale(1); lightCap('Period'); }
  else if (c === 'ArrowDown') setFolded(true);
  else if (c === 'ArrowUp') setFolded(false);
  else return;
  ev.preventDefault();
});

const midiOf = (n) => Math.round(69 + 12 * Math.log2(freq(n) / 440));
// Waar ligt een toonhoogte op de huidige handpan? -1 = ding, 0..8 = toonveld, null = niet aanwezig
function slotFor(midi, sc) {
  if (midiOf(sc.ding) === midi) return -1;
  const k = sc.notes.findIndex(n => midiOf(n) === midi);
  return k >= 0 ? k : null;
}
// Kleinste verschuiving (in halve tonen) waarbij alle noten op deze handpan liggen
function fitShift(song, sc) {
  for (let d = 0; d <= 12; d++) for (const sh of d ? [-d, d] : [0]) {
    if (song.every(x => slotFor(midiOf(x.n) + sh, sc) !== null)) return sh;
  }
  return null;
}
const songState = { mode: 'idle', song: null, slots: [], pos: 0, misses: 0, timers: [] };
const songEl = (id) => document.getElementById(id);
const st = () => LANGS[lang].song;

function songStatus(text, cls) {
  const e = songEl('songStatus');
  e.textContent = text; e.className = cls || '';
}
function songMark() {
  document.querySelectorAll('.target').forEach(t => t.classList.remove('now', 'next'));
  document.querySelectorAll('.cap.target-now').forEach(c => c.classList.remove('target-now'));
  if (songState.mode === 'idle') return;
  const mark = (slot, cls) => {
    if (slot === undefined) return;
    const t = slot === -1 ? dingEl.target : fieldEls[slot] && fieldEls[slot].target;
    if (t) t.classList.add(cls);
    if (cls === 'now' && songState.mode === 'practice') {
      const cap = capEls[slot === -1 ? 'Space' : TONE_KEYS[slot]];
      if (cap) cap.classList.add('target-now');
    }
  };
  mark(songState.slots[songState.pos + 1], 'next');
  mark(songState.slots[songState.pos], 'now');
}
function songButtons() {
  const t = st(), m = songState.mode;
  songEl('songListen').textContent = t.listen;
  songEl('songPractice').textContent = t.practice;
  songEl('songStop').title = t.stop;
  songEl('songListen').classList.toggle('on', m === 'listen');
  songEl('songPractice').classList.toggle('on', m === 'practice');
  songEl('songStop').disabled = m === 'idle';
}
function songStop(quiet) {
  songState.timers.forEach(clearTimeout); songState.timers = [];
  songState.mode = 'idle';
  songMark(); songButtons();
  if (!quiet) songStatus(st().pick);
}
// Zet het gekozen liedje klaar op de huidige toonladder; wisselt zo nodig naar een toonladder waarin het past
function songPrepare() {
  const song = SONGS[+songEl('songSel').value];
  let sh = fitShift(song, SCALES[current()]), note = '';
  if (sh === null) {
    const i = SCALES.findIndex(sc => fitShift(song, sc) !== null);
    if (i < 0) return false;
    songState.mode = 'idle';
    setScale(i - current());
    note = st().switched + ' ' + LANGS[lang].scales[i] + ' · ';
    sh = fitShift(song, SCALES[current()]);
  }
  songState.song = song;
  songState.slots = song.map(x => slotFor(midiOf(x.n) + sh, SCALES[current()]));
  songState.pos = 0; songState.misses = 0;
  return note;
}
function songProgress(prefix) {
  const t = st();
  songStatus((prefix || '') + `${t.note} ${Math.min(songState.pos + 1, songState.slots.length)} ${t.of} ${songState.slots.length}`);
}
function songPractice() {
  initAudio(); songStop(true);
  const note = songPrepare();
  if (note === false) return;
  songState.mode = 'practice';
  songMark(); songButtons(); songProgress(note);
}
function songListen() {
  initAudio(); songStop(true);
  const note = songPrepare();
  if (note === false) return;
  songState.mode = 'listen';
  songMark(); songButtons(); songProgress(note);
  const song = songState.song, beat = 60 / song.bpm * 1000;
  let at = 300, i = 0;
  song.items.forEach((x) => {
    if (!x.rest) {
      const k = i++;
      songState.timers.push(setTimeout(() => {
        songState.pos = k; songMark(); songProgress();
        const slot = songState.slots[k];
        if (slot === -1) baseDing(.8); else baseTone(slot, .8);
      }, at));
    }
    at += x.beats * beat;
  });
  if (song.cat === 'reggae') {
    for (let b = 0; b < at - 300; b += beat) songState.timers.push(setTimeout(() => perc('tak'), 300 + b + beat / 2));
  }
  songState.timers.push(setTimeout(() => { songStop(true); songStatus(st().pick); }, at + 400));
}
// Elke aanslag (toets, vinger of muis) komt hier langs tijdens het oefenen
function songHit(slot) {
  if (songState.mode !== 'practice') return;
  if (slot === songState.slots[songState.pos]) {
    songState.pos++;
    if (songState.pos >= songState.slots.length) {
      const misses = songState.misses;
      songStop(true);
      songStatus(`${st().done} ${misses}`, 'good');
      return;
    }
    songMark(); songProgress();
  } else {
    songState.misses++;
    songStatus(st().miss, 'bad');
  }
}
const baseTone = playTone, baseDing = playDing;
playTone = function (k, vel) { baseTone(k, vel); songHit(k); };
playDing = function (vel) { baseDing(vel); songHit(-1); };

// Rood doelvlak op elk veld: kopie van de veldvorm, onder de letters
const baseBuildPan = buildPan, baseBuildKbd = buildKbd;
buildPan = function () {
  baseBuildPan();
  [...fieldEls, dingEl].forEach(f => {
    const t = f.g.firstChild.cloneNode(false);
    t.setAttribute('class', 'target');
    t.removeAttribute('fill'); t.removeAttribute('stroke'); t.removeAttribute('stroke-width');
    f.g.insertBefore(t, f.glow);
    f.target = t;
  });
};
buildKbd = function () { baseBuildKbd(); songMark(); };
// Zelf van toonladder wisselen tijdens een liedje: opnieuw klaarzetten als het past, anders stoppen
const baseSetScale = setScale;
setScale = function (step) {
  baseSetScale(step);
  if (!step || songState.mode === 'idle') return;
  const sh = fitShift(songState.song, SCALES[current()]);
  if (sh === null) { songStop(); return; }
  songState.slots = songState.song.map(x => slotFor(midiOf(x.n) + sh, SCALES[current()]));
  songMark();
};
function songLabels() {
  const sel = songEl('songSel'), v = sel.value || store.get('song', 0);
  sel.innerHTML = '';
  SONG_CATS.forEach(cat => {
    const g = document.createElement('optgroup');
    g.label = st().cats[cat];
    SONGS.forEach((sg, i) => { if (sg.cat === cat) g.appendChild(new Option('🎵 ' + st().names[sg.id], i)); });
    sel.appendChild(g);
  });
  sel.value = v;
  songButtons();
  if (songState.mode === 'idle') songStatus(st().pick);
}
songEl('songSel').onchange = () => { store.set('song', +songEl('songSel').value); songStop(); songEl('songSel').blur(); };
songEl('songListen').onclick = songListen;
songEl('songPractice').onclick = songPractice;
songEl('songStop').onclick = () => songStop();

// ---------- Recorder linksonder: opnemen, pauze, stop, afspelen, bewaren ----------
// Neemt alles op wat de app laat klinken (dezelfde aftakking als de Studio-opname), zonder microfoon.
let recorder = null, recChunks = [], recUrl = null, recMime = '', recElapsed = 0, recSince = 0;
const recBar = document.getElementById('recBar'), recTimeEl = document.getElementById('recTime');
const player = new Audio();
const fmt = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
const recEl = (id) => document.getElementById(id);

function recUpdate() {
  const recording = recorder && recorder.state === 'recording', paused = recorder && recorder.state === 'paused';
  const playing = !player.paused;
  recBar.classList.toggle('recording', !!recorder);
  recBar.classList.toggle('paused', !!paused);
  recEl('recBtn').disabled = !window.MediaRecorder || recording || playing;
  recEl('recPause').disabled = !(recording || playing);
  recEl('recStop').disabled = !(recorder || playing || player.currentTime > 0);
  recEl('recPlay').disabled = !recUrl || !!recorder || playing;
  recEl('recSave').disabled = !recUrl || !!recorder;
  const r = LANGS[lang].recorder;
  [['recBtn', paused ? r.resume : r.rec], ['recPause', r.pause], ['recStop', r.stop], ['recPlay', r.play], ['recSave', r.save]]
    .forEach(([id, label]) => { recEl(id).title = label; recEl(id).setAttribute('aria-label', label); });
}
function recTick() {
  if (recorder) recTimeEl.textContent = fmt(recElapsed + (recorder.state === 'recording' ? (performance.now() - recSince) / 1000 : 0));
  else if (!player.paused || player.currentTime > 0) recTimeEl.textContent = `${fmt(player.currentTime)} / ${fmt(recElapsed)}`;
  requestAnimationFrame(recTick);
}
function recStart() {
  initAudio();
  if (recorder && recorder.state === 'paused') { recorder.resume(); recSince = performance.now(); recUpdate(); return; }
  if (recorder) return;
  player.pause(); player.currentTime = 0;
  const mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported(m));
  recChunks = []; recElapsed = 0; recSince = performance.now();
  recorder = new MediaRecorder(capture.stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    if (recUrl) URL.revokeObjectURL(recUrl);
    recMime = recorder.mimeType;
    recUrl = URL.createObjectURL(new Blob(recChunks, { type: recMime }));
    player.src = recUrl;
    recorder = null;
    recTimeEl.textContent = fmt(recElapsed);
    recUpdate();
  };
  recorder.start(500);
  recUpdate();
}
function recPause() {
  if (recorder && recorder.state === 'recording') { recorder.pause(); recElapsed += (performance.now() - recSince) / 1000; }
  else if (!player.paused) player.pause();
  recUpdate();
}
function recStop() {
  if (recorder) {
    if (recorder.state === 'recording') recElapsed += (performance.now() - recSince) / 1000;
    recorder.stop();
  } else { player.pause(); player.currentTime = 0; recTimeEl.textContent = fmt(recElapsed); }
  recUpdate();
}
function recSave() {
  if (!recUrl) return;
  const a = document.createElement('a');
  a.href = recUrl;
  a.download = 'Handpan-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + (recMime.includes('ogg') ? '.ogg' : '.webm');
  a.click();
}
recEl('recBtn').onclick = recStart;
recEl('recPause').onclick = recPause;
recEl('recStop').onclick = recStop;
recEl('recPlay').onclick = () => { player.play(); recUpdate(); };
recEl('recSave').onclick = recSave;
player.onplay = player.onpause = player.onended = recUpdate;
requestAnimationFrame(recTick);

langEl.onchange = () => { lang = langEl.value; store.set('lang', lang); applyLang(); langEl.blur(); };

applyLang();
</script>
<script src="studio.js?v=1.6"></script>
</body>
</html>
